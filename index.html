<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>비서실</title>
  <meta name="theme-color" content="#2f3a4f" />
  <meta name="description" content="나만의 비서들이 하루를 챙겨 주는 개인 비서 앱" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="config.js"></script>
</head>
<body>
  <!-- 로그인 -->
  <section id="login" class="login">
    <div class="login-card">
      <img class="login-logo" src="icons/icon-192.png" alt="" />
      <h1>비서실</h1>
      <p class="muted">나만의 비서들이 오늘 하루를 함께 챙깁니다.</p>
      <button id="btn-google" class="btn btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-16.6z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
        Google 계정으로 로그인
      </button>
      <button id="btn-demo" class="btn btn-ghost">데모로 둘러보기</button>
      <button class="btn btn-ghost btn-install" hidden>📲 휴대폰에 앱 설치</button>
      <p id="login-msg" class="login-msg" role="alert"></p>
      <details class="setup-hint" id="setup-hint">
        <summary>로그인이 안 되나요?</summary>
        <p>이 비서실에 등록된 Google 계정만 로그인할 수 있어요. 처음 로그인할 때 Gmail·캘린더 읽기 권한을 허용해야 메일·일정·푸시 알림이 동작합니다.</p>
      </details>
    </div>
  </section>

  <!-- 앱 -->
  <section id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand"><img src="icons/icon-192.png" alt="" /> 비서실</div>
      <div class="today" id="today"></div>
      <div class="user">
        <button class="btn btn-small btn-ghost btn-install" hidden title="앱 설치">📲</button>
        <img id="user-pic" class="avatar" alt="" hidden />
        <span id="user-name" class="hide-sm"></span>
        <button id="btn-settings" class="btn btn-small btn-ghost" title="설정">⚙️</button>
        <button id="btn-logout" class="btn btn-small btn-ghost" title="로그아웃">⎋</button>
      </div>
    </header>

    <main class="layout">
      <section class="office-wrap view-office">
        <div class="office" id="office" aria-label="사무실"></div>
        <div class="roster" id="roster"></div>
        <aside class="agent-panel" id="agent-panel" hidden>
          <div class="grabber"></div>
          <button class="panel-close" id="panel-close" aria-label="닫기">✕</button>
          <div class="panel-head" id="panel-head"></div>
          <div class="panel-body" id="panel-body"></div>
        </aside>
      </section>

      <section class="checklist view-list">
        <div class="cl-head">
          <h2>내 체크리스트</h2>
          <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
          <div class="progress-text" id="progress-text"></div>
        </div>
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="todo">해야 할 일 <span class="count" id="cnt-todo">0</span></button>
          <button class="tab" data-tab="review">확인해 줄 일 <span class="count" id="cnt-review">0</span></button>
          <button class="tab" data-tab="done">완료 <span class="count" id="cnt-done">0</span></button>
        </div>
        <form class="add-form" id="add-form">
          <input id="add-title" class="field" placeholder="새 항목 추가… (Enter)" autocomplete="off" required />
          <div class="add-opts">
            <select id="add-type" class="field" aria-label="종류"><option value="todo">할 일</option><option value="review">확인 필요</option></select>
            <select id="add-priority" class="field" aria-label="중요도"><option value="normal">보통</option><option value="high">중요</option><option value="low">낮음</option></select>
            <input type="date" id="add-due" class="field" aria-label="마감일" />
            <button class="btn btn-primary btn-small" type="submit">추가</button>
          </div>
        </form>
        <ul class="items" id="items"></ul>
        <div class="cl-foot">
          <button class="btn btn-small btn-ghost" id="btn-export">내보내기</button>
          <label class="btn btn-small btn-ghost">가져오기<input type="file" id="file-import" accept="application/json" hidden /></label>
          <button class="btn btn-small btn-ghost" id="btn-clear-done">완료 비우기</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-view="office" class="active"><span>🏢</span>사무실</button>
      <button data-view="list"><span>☑️<i id="nav-badge"></i></span>체크리스트</button>
      <button data-view="settings"><span>⚙️</span>설정</button>
    </nav>
  </section>

  <dialog id="settings" class="sheet">
    <div class="sheet-head"><h3>설정</h3><button class="panel-close" id="settings-close" aria-label="닫기">✕</button></div>
    <div class="panel-body" id="settings-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
